{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Set New Password</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    font-family: Inter;
    color: white;
}

/* VIDEO */
#bg-video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
}

/* OVERLAY */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(12,19,36,0.7);
    z-index: -1;
}

/* GLASS */
.glass {
    background: rgba(25,31,49,0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
}

/* BUTTON */
.btn {
    background: linear-gradient(135deg,#fb923c,#c2410c);
}

/* INPUT */
input {
    width: 100%;
    margin-top: 8px;
    padding: 12px;
    background: #070d1f;
    border: 1px solid #4b5563;
    border-radius: 6px;
    color: white;
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen">

<!-- VIDEO -->
<video autoplay muted loop id="bg-video">
    <source src="{% static 'videos/plane.mp4' %}" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- CARD -->
<div class="glass p-10 rounded-xl w-full max-w-md text-center">

    <h2 class="text-2xl text-[#ffb874] font-bold mb-6">
        Set New Password
    </h2>

    <form method="POST" action="" class="space-y-5">
        {% csrf_token %}

        <!-- 🔥 SHOW ERRORS -->
        {% if form.errors %}
        <div class="text-red-400 text-sm text-left">
            {{ form.errors }}
        </div>
        {% endif %}

        <!-- NEW PASSWORD -->
        <div class="text-left relative">
            <label class="text-xs text-gray-400">New Password</label>

            {{ form.new_password1 }}

            <span onclick="toggle('id_new_password1')" 
                  class="absolute right-3 top-9 cursor-pointer text-gray-400 z-10">
                👁
            </span>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="text-left relative">
            <label class="text-xs text-gray-400">Confirm Password</label>

            {{ form.new_password2 }}

            <span onclick="toggle('id_new_password2')" 
                  class="absolute right-3 top-9 cursor-pointer text-gray-400 z-10">
                👁
            </span>
        </div>

        <!-- BUTTON -->
        <button type="submit"
            class="w-full btn py-3 rounded font-bold text-black hover:scale-105 transition">
            Update Password
        </button>
    </form>

</div>

<!-- SCRIPT -->
<script>
function toggle(id){
    let field = document.getElementById(id);
    field.type = field.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
