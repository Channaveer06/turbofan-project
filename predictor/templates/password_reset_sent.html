{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Email Sent</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { font-family: Inter; color:white; }
#bg-video {
    position:fixed; width:100%; height:100%;
    object-fit:cover; z-index:-2;
}
.overlay {
    position:fixed; width:100%; height:100%;
    background:rgba(12,19,36,0.7); z-index:-1;
}
.glass {
    background: rgba(25,31,49,0.7);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen">

<video autoplay muted loop id="bg-video">
    <source src="{% static 'videos/plane.mp4' %}" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="glass p-10 rounded-xl text-center max-w-md">
    <h2 class="text-2xl text-[#ffb874] font-bold mb-4">
        📩 Email Sent
    </h2>

    <p class="text-gray-300 mb-6">
        A password reset link has been sent to your email.
    </p>

    <p class="text-sm text-gray-400">
        Check your inbox or spam folder.
    </p>
</div>

</body>
</html>
