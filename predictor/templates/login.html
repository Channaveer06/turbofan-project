{% load static %}
<!DOCTYPE html>

<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<script>
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                background: "#0c1324",
                primary: "#b8860b",
                "on-surface": "#dce1fb",
                "surface-container-lowest": "#070d1f",
                "outline-variant": "#45464d",
                tertiary: "#7bd0ff"
            }
        }
    }
}
</script>

<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; }

#bg-video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
}

.video-overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    background: linear-gradient(rgba(12,19,36,0.1), rgba(12,19,36,0.1));
    z-index: -1;
}

.glass-card {
    background: rgba(25, 31, 49, 0.75);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
}

.aviation-gradient {
    background: linear-gradient(135deg, #fb923c 0%, #c2410c 100%);
}

body {
    margin:0;
    font-family:Inter;
    background:#0c1324;
    color:#e2e8f0;
    cursor: none;
}

.cursor {
    position: fixed;
    width: 10px;
    height: 10px;
    background: #fb923c;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
}

.cursor-trail {
    position: fixed;
    width: 30px;
    height: 30px;
    border: 2px solid #fb923c;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
}

#login-loader {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #0c1324;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    color: #ffb874;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255,184,116,0.2);
    border-top: 4px solid #ffb874;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 15px;
}

.fade-out {
    opacity: 0;
    transition: opacity 0.5s ease;
}

.fade-in {
    opacity: 0;
    animation: fadeIn 0.6s ease forwards;
}

@keyframes fadeIn { to { opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
</style>

</head>

<body class="fade-in min-h-screen flex flex-col">

<!-- VIDEO -->
<video autoplay muted loop id="bg-video">
    <source src="{% static 'videos/plane.mp4' %}" type="video/mp4">
</video>

<div class="video-overlay"></div>

<!-- HEADER -->
<header class="fixed top-0 w-full flex justify-start items-center px-8 h-20 z-50">
    
    <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-orange-400 text-4xl">
            flight_takeoff
        </span>

        <h1 class="text-3xl font-black uppercase"
        style="background: linear-gradient(135deg,#fb923c,#c2410c);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;">
            AERO_CORE
        </h1>
    </div>

</header>

<!-- MAIN -->
<main class="flex-grow flex items-center justify-center pt-20 pb-12">
    <div class="w-full max-w-md px-6">
        <div class="glass-card rounded-xl p-8 shadow-2xl">

            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-white">Access Portal</h2>
                <p class="text-sm opacity-70">AERO_CORE PREDICTIVE MAINTENANCE</p>
            </div>

            <form method="POST" class="space-y-6">
                {% csrf_token %}

                {% if error %}
                <p class="text-red-400 text-center">{{ error }}</p>
                {% endif %}

                <div>
                    <label class="text-xs uppercase opacity-70">User name</label>
                    <input name="username" type="text"
                    class="w-full mt-2 p-3 bg-[#070d1f] rounded border border-gray-600"/>
                </div>

                <!-- PASSWORD + FORGOT -->
                <div>
                    <label class="text-xs uppercase opacity-70">Password</label>
                    <input name="password" type="password"
                    class="w-full mt-2 p-3 bg-[#070d1f] rounded border border-gray-600"/>

                    <div class="text-right mt-2">
                        <a href="{% url 'password_reset' %}" 
                           class="text-xs text-orange-400 hover:text-orange-300 transition">
                            Forgot Password?
                        </a>
                    </div>
                </div>

                <!-- BUTTON -->
                <button type="submit"
                    onclick="handleLogin(event)"
                    class="w-full aviation-gradient py-3 rounded font-bold hover:scale-105 hover:brightness-110 transition duration-300">
                    INITIATE SESSION
                </button>

                <!-- SIGNUP -->
                <p class="text-center mt-4">
                    New user? 
                    <a href="{% url 'signup' %}" class="text-orange-400">
                        Request Access
                    </a>
                </p>

            </form>

        </div>
    </div>
</main>

<footer class="text-center py-6 text-xs opacity-60">
© 2024 AERO_CORE SYSTEM
</footer>

<!-- CURSOR -->
<div class="cursor"></div>
<div class="cursor-trail"></div>

<!-- LOADER -->
<div id="login-loader">
    <div class="spinner"></div>
    <p>Authenticating...</p>
</div>

<script>
const cursor = document.querySelector(".cursor");
const trail = document.querySelector(".cursor-trail");

let mouseX=0,mouseY=0,trailX=0,trailY=0;

document.addEventListener("mousemove", e=>{
    mouseX=e.clientX; mouseY=e.clientY;
    cursor.style.left=mouseX+"px";
    cursor.style.top=mouseY+"px";
});

function animate(){
    trailX+=(mouseX-trailX)*0.1;
    trailY+=(mouseY-trailY)*0.1;
    trail.style.left=trailX+"px";
    trail.style.top=trailY+"px";
    requestAnimationFrame(animate);
}
animate();

function handleLogin(event){
    event.preventDefault();

    document.body.classList.add("fade-out");
    document.getElementById("login-loader").style.display="flex";

    setTimeout(()=>{
        event.target.closest("form").submit();
    },500);
}
</script>

</body>
</html>
