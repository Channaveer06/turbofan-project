{% load static %}
<!DOCTYPE html>

<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<script>
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                background: "#0c1324",
                primary: "#ffb874",
                "on-surface": "#dce1fb",
                "surface-container-lowest": "#070d1f",
                "outline-variant": "#45464d",
                tertiary: "#7bd0ff"
            }
        }
    }
}
</script>

<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; }

/* 🔥 FIXED BACKGROUND */
.bg-login {
    background: 
        linear-gradient(rgba(12,19,36,0.7), rgba(12,19,36,0.85)),
        url("{% static 'images/plane2.jpeg' %}");
    background-size: cover;
    background-position: center;
}

/* Glass card */
.glass-card {
    background: rgba(25, 31, 49, 0.65);
    backdrop-filter: blur(12px);
}

/* Button gradient */
.aviation-gradient {
    background: linear-gradient(135deg, #ffb874 0%, #bd6d00 100%);
}

/* ✨ Animation */
.fade-in {
    animation: fadeUp 0.9s ease forwards;
}
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

</head>

<body class="bg-login text-on-surface font-body min-h-screen flex flex-col">

<!-- HEADER -->
<header class="fixed top-0 w-full bg-[#0c1324]/60 backdrop-blur-xl flex justify-between items-center px-8 h-20 z-50">
    <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-primary">flight_takeoff</span>
        <h1 class="text-2xl font-black text-primary uppercase">AERO_CORE</h1>
    </div>
</header>

<!-- MAIN -->
<main class="flex-grow flex items-center justify-center pt-20 pb-12">
    <div class="w-full max-w-md px-6">

        <div class="glass-card fade-in rounded-xl p-8 shadow-2xl">

            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold">Access Portal</h2>
                <p class="text-sm opacity-70">AERO_CORE PREDICTIVE MAINTENANCE</p>
            </div>

            <form method="POST" class="space-y-6">
                {% csrf_token %}

                {% if error %}
                <p class="text-red-400 text-center">{{ error }}</p>
                {% endif %}

                <!-- EMAIL -->
                <div>
                    <label class="text-xs uppercase opacity-70">Terminal ID / Email</label>
                    <input name="username" type="text" placeholder="Enter username"
                    class="w-full mt-2 p-3 bg-surface-container-lowest rounded border border-outline-variant"/>
                </div>

                <!-- PASSWORD -->
                <div>
                    <label class="text-xs uppercase opacity-70">Password</label>
                    <input name="password" type="password" placeholder="••••••"
                    class="w-full mt-2 p-3 bg-surface-container-lowest rounded border border-outline-variant focus:ring-1 focus:ring-primary"/>
                </div>

                <!-- BUTTON -->
                <button type="submit" 
                    class="w-full aviation-gradient py-3 rounded font-bold hover:scale-105 transition">
                    INITIATE SESSION
                </button>

            </form>

        </div>

    </div>
</main>

<!-- FOOTER -->
<footer class="text-center py-6 text-xs opacity-60">
© 2024 AERO_CORE SYSTEM
</footer>

</body>
</html>
