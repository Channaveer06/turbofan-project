{% load static %}
<!DOCTYPE html>

<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet"/>

<style>
body {
    margin:0;
    font-family:Inter;
    color:white;
}

/* VIDEO */
#bg-video {
    position: fixed;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* OVERLAY */
.overlay {
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(12,19,36,0.7);
    z-index:-1;
}

/* GLASS */
.glass {
    background: rgba(25,31,49,0.7);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,0.1);
}

/* BUTTON */
.btn {
    background: linear-gradient(135deg,#fb923c,#c2410c);
}
</style>

</head>

<body class="flex items-center justify-center min-h-screen">

<!-- VIDEO -->
<video autoplay muted loop id="bg-video">
    <source src="{% static 'videos/plane.mp4' %}" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- CARD -->
<div class="glass p-10 rounded-xl w-full max-w-md text-center">

    <h2 class="text-3xl font-bold text-[#ffb874] mb-4">
        Reset Password
    </h2>

    <p class="text-sm text-gray-300 mb-6">
        Enter your registered email to receive reset link
    </p>

    <form method="POST" class="space-y-4">
        {% csrf_token %}

        <input type="email" name="email" required
            placeholder="Enter your email"
            class="w-full p-3 bg-[#070d1f] rounded border border-gray-600">

        <button type="submit"
            class="w-full btn py-3 rounded font-bold text-black hover:scale-105 transition">
            Send Reset Link
        </button>
    </form>

    <p class="text-xs mt-6 text-gray-400">
        Remember password?
        <a href="/login/" class="text-orange-400">Login</a>
    </p>

</div>

</body>
</html>
